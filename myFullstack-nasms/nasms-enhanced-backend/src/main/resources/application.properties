spring.config.import=optional:file:.env[.properties]

# ── Database ──────────────────────────────────────────────────────────────────
# FIXED: Changed dots to underscores to match Docker Compose environment injection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Avoid serialising lazy-loaded Hibernate proxies
spring.jackson.serialization.fail-on-empty-beans=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8086

# ── Weather API ───────────────────────────────────────────────────────────────
# FIXED: Updated to standard uppercase underscores
weather.api.base-url=${WEATHER_API_BASE_URL}
weather.api.key=${WEATHER_API_KEY}
weather.api.units=metric

# ── JWT ───────────────────────────────────────────────────────────────────────
# FIXED: Updated to standard uppercase underscores
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ── Disable default UserDetailsService auto-config ───────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.security.enabled=false
