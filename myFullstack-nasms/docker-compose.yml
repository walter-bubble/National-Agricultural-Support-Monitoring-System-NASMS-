services:
  db-service:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2776"
      POSTGRES_DB: nasms_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nasms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-service:
    build:
      context: ./nasms-enhanced-backend
    container_name: spring-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db-service:5432/nasms_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=2776
      - WEATHER_API_BASE_URL=https://api.openweathermap.org/data/2.5
      - WEATHER_API_KEY=6b7b5b0cbb50ce8956762d1e3e9c4ad6
      - WEATHER_API_UNITS=metric
      - JWT_SECRET=oxZN3M3pcX+rN8GpvqEGbVZIwddCkut07D+mI44MYD4=
      - JWT_EXPIRATION=86400000
    depends_on:
      db-service:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend-service:
    build:
      context: ./nasms-enhanced-frontend
    container_name: vite-frontend
    depends_on:
      backend-service:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx-gateway:
    image: nginx:alpine
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-service:
        condition: service_healthy
      backend-service:
        condition: service_healthy
    restart: always

volumes:
  pgdata: